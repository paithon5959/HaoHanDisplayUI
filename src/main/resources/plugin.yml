name: HaoHanDisplayUI
version: '${project.version}'
main: vn.haohan.displayui.HaoHanDisplayUIPlugin
api-version: '1.20'
description: Reusable in-world Display UI engine for HaoHanSMP plugins
authors: [ HaoHanSMP ]
website: https://haohansmp.dev
folia-supported: true

commands:
  hhdui:
    description: HaoHan Display UI engine commands
    usage: /hhdui <demo|test|clear|stats|page|follow|camera|open|close|list|reload|debug>
    aliases: [displayui]
    permission: haohansmp.displayui.admin
  uidebug:
    description: HaoHan Display UI inspection and debug tool
    usage: /uidebug <tree|inspect|clickinspect|layer|container|component|solo|unsolo|showall|hideall|reset|list>
    aliases: [hhduidbg]
    permission: haohansmp.displayui.admin

permissions:
  haohansmp.displayui.admin:
    description: Manage and test HaoHan Display UI
    default: op
  haohan.displayui.admin:
    description: Manage and test HaoHan Display UI
    default: op
  haohan.displayui.debug:
    description: Debug HaoHan Display UI
    default: op
